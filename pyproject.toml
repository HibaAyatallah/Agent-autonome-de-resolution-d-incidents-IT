[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-it-incident-response"
version = "0.1.0"
description = "Prototype modulaire multi-agents pour le triage contrôlé d'incidents IT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "pandas>=2.2,<4.0",
  "openpyxl>=3.1,<4.0",
  "psutil>=6.0,<8.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<10.0",
  "ruff>=0.6,<1.0",
]
postgres = ["psycopg[binary]>=3.2,<4.0"]

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
